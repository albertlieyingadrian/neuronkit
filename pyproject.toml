[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "neuronkit"
version = "0.1.0"
description = "MLP neurons as an interpretable basis: per-neuron percentiles, tail-only sparsity, subcircuits, modes, description scores and neuron-basis monitors for Hugging Face models."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Albert Lie" }]
keywords = ["interpretability", "neurons", "mechanistic-interpretability", "transformers", "mixture-of-experts", "autointerp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.4",
    "transformers>=5.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# judge steps (describe, predict, simulate, modes) share circuitcheck's excerpt format and prompts
labels = ["circuitcheck>=0.1"]
transformer-lens = ["transformer-lens>=2.15"]
nnsight = ["nnsight>=0.4"]
dev = ["pytest>=8", "ruff>=0.6", "circuitcheck>=0.1"]

[project.urls]
Homepage = "https://github.com/albertlieyingadrian/neuronkit"
Source = "https://github.com/albertlieyingadrian/neuronkit"

[tool.hatch.build.targets.wheel]
packages = ["src/neuronkit"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B023", "SIM105", "SIM108", "SIM300"]

[tool.pytest.ini_options]
testpaths = ["tests"]
